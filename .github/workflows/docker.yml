name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Required for the build provenance attestation below.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Pull requests from forks cannot access GITHUB_TOKEN with write scope,
      # so PRs build without pushing. Merges to main and tags publish.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=obsidian-vault-mcp
            org.opencontainers.image.description=MCP search, read, and write server for an Obsidian vault

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only. arm64 would have to cross-build better-sqlite3,
          # sqlite-vec, and onnxruntime-node under QEMU, which takes tens of
          # minutes and produces an image no x86 NAS will ever run. Add
          # linux/arm64 here only if you actually need it.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Smoke test the image we just built: it must start, answer /healthz, and
      # list its tools. OHS_ENABLED=false because a real search backend needs a
      # vault and an embedding endpoint neither of which exist on a runner.
      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          mkdir -p /tmp/vault /tmp/state
          # Deliberately a UID that does not exist in the image, to prove the
          # nss_wrapper path in docker-entrypoint.sh works.
          chown -R 4242:4242 /tmp/vault /tmp/state
          docker run -d --name smoke -p 3940:3940 \
            --user 4242:4242 \
            -e VAULT_PATH=/vault \
            -e GIT_ENABLED=false \
            -e OHS_ENABLED=false \
            -v /tmp/vault:/vault \
            -v /tmp/state:/state \
            "$IMAGE"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3940/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3940/healthz || { docker logs smoke; exit 1; }
          curl -sS http://127.0.0.1:3940/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | tee /tmp/tools.txt
          grep -q save_note /tmp/tools.txt || { docker logs smoke; exit 1; }
          # git must work despite the unknown uid and foreign-owned tree
          docker exec smoke sh -c 'git init -q /vault/t && git -C /vault/t status' \
            || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
