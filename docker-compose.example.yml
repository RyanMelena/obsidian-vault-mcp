# One MCP server over one vault: search, read, and write.
# The Python process supervises `obsidian-hybrid-search serve` on loopback,
# so there is a single container, a single Traefik route, and a single
# endpoint to register in Open WebUI.

services:
  obsidian-vault:
    # Published by .github/workflows/docker.yml. Pin a version tag in
    # production; :latest tracks main.
    image: ghcr.io/ryanmelena/mcp-obsidian-vault:latest
    container_name: obsidian-vault
    # Defaults to 3000:3000. Set this to whatever owns the vault dataset —
    # the image works under any uid:gid. If you use a bind mount for /state
    # instead of the named volume below, chown it to match.
    user: "3000:3000"
    restart: unless-stopped
    env_file: .env
    # Prefer a secret over GIT_TOKEN in .env; the entrypoint reads it via
    # GIT_TOKEN_FILE and never writes it into .git/config or the remote URL.
    secrets: [gitea_token]
    environment:
      GIT_TOKEN_FILE: /run/secrets/gitea_token
    volumes:
      - /mnt/perfpool/obsidian/vault:/vault
      # SSH deploy key — only needed for an ssh:// remote. With GIT_TOKEN or
      # GIT_TOKEN_FILE set for an HTTP(S) remote, drop this mount entirely.
      # - /mnt/perfpool/docker/stacks/obsidian/ssh:/home/app/.ssh:ro
      # Writable state: reranker ONNX weights (~570 MB), caches, gitconfig,
      # and the synthesized passwd file. A named volume inherits the image's
      # 0777 mode, so it works whatever uid you run as.
      - vault-state:/state
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3940/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.obsidian-vault.rule=Host(`obsidian-vault.internal.example.com`)
      - traefik.http.routers.obsidian-vault.entrypoints=websecure
      - traefik.http.routers.obsidian-vault.tls.certresolver=route53
      - traefik.http.services.obsidian-vault.loadbalancer.server.port=3940

secrets:
  gitea_token:
    file: ./secrets/gitea_token

volumes:
  vault-state:

networks:
  proxy:
    external: true
