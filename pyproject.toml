[project]
name = "obsidian-vault-mcp"
version = "0.3.0"
description = "MCP write surface and Gitea sync bridge for an Obsidian vault"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1,<3",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.52.4",
]

[project.scripts]
obsidian-vault-mcp = "obsidian_vault_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_vault_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
